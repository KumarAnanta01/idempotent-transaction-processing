
server:
  port: 8080

spring:
  application:
    name: idempotent-transaction

  datasource:
    url: jdbc:h2:file:./data/transactiondb;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-}]"

  level:
    com.mphasis.transaction: DEBUG
    org.hibernate.SQL: DEBUG
